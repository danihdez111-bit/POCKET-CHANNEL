<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POCKET CHANNEL</title>
<meta name="description" content="Graba ideas de cancion por capas, sin conexion.">
<meta name="theme-color" content="#14110E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Channel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --ground:#14110E; --surface:#1E1A15; --surface-2:#2A251E; --line:#3A342B;
    --text:#F2ECE0; --muted:#A79B87; --faint:#6E6555;
    --accent:#E8A33D; --accent-soft:#3a2f1c; --accent-ink:#1a1206;
    --rec:#E2483D; --rec-soft:#3a1a17;
    --good:#68C39A;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --r-lg:22px; --r-md:16px; --r-sm:11px;
    --app-max:480px;
    --host-pad:0px;
    --f-display:"Bricolage Grotesque", system-ui, sans-serif;
    --f-body:"Hanken Grotesk", system-ui, sans-serif;
    --f-mono:"Space Mono", ui-monospace, monospace;
  }
  /* Light theme */
  :root[data-theme="light"]{
    --ground:#F1EBDF; --surface:#FBF7EE; --surface-2:#FFFFFF; --line:#E1D8C6;
    --text:#241E15; --muted:#6F6555; --faint:#9C917C;
    --accent:#B9791A; --accent-soft:#f3e6cd; --accent-ink:#2a1c05;
    --rec:#C93B30; --rec-soft:#f6ddd9;
    --good:#3f9e73;
    --shadow:0 12px 30px rgba(80,60,20,.16);
  }
  :root[data-theme="dark"]{
    --ground:#14110E; --surface:#1E1A15; --surface-2:#2A251E; --line:#3A342B;
    --text:#F2ECE0; --muted:#A79B87; --faint:#6E6555;
    --accent:#E8A33D; --accent-soft:#3a2f1c; --accent-ink:#1a1206;
    --rec:#E2483D; --rec-soft:#3a1a17; --good:#68C39A;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--text);
    font-family:var(--f-body); -webkit-font-smoothing:antialiased;
    font-size:16px; line-height:1.4;
    display:flex; justify-content:center;
  }
  button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none}
  ::selection{background:var(--accent); color:var(--accent-ink)}

  #app{
    width:100%; max-width:var(--app-max); min-height:100dvh;
    background:var(--ground); display:flex; flex-direction:column;
    position:relative; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;   /* sin selección accidental de texto */
  }
  input, textarea{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
  @media (min-width:520px){
    body{padding:22px 0}
    #app{min-height:auto; height:calc(100dvh - 44px); border:1px solid var(--line);
      border-radius:30px; box-shadow:var(--shadow); overflow:hidden}
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:12px; padding:16px 18px 12px;
    border-bottom:1px solid var(--line); background:var(--ground); position:relative; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .brand .dot{width:11px; height:11px; border-radius:50%; background:var(--rec);
    box-shadow:0 0 0 4px var(--rec-soft); flex:none}
  .brand h1{
    font-family:var(--f-display); font-weight:800; font-size:16px; letter-spacing:.14em;
    text-transform:uppercase; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .iconbtn{
    width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
    color:var(--muted); border:1px solid transparent; flex:none;
  }
  .iconbtn:hover{background:var(--surface); color:var(--text)}
  .iconbtn:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .spacer{flex:1}
  .back{width:auto; padding:0 12px 0 6px; gap:6px; font-weight:600; font-size:14px; color:var(--muted)}
  .back:hover{color:var(--text)}

  /* ---------- screens ---------- */
  .screen{flex:1; display:flex; flex-direction:column; min-height:0}
  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
  [hidden]{display:none!important}

  /* ---------- projects list ---------- */
  .list-head{padding:20px 18px 6px}
  .eyebrow{font-family:var(--f-mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--faint); margin:0 0 6px}
  .list-head h2{font-family:var(--f-display); font-weight:800; font-size:27px; margin:0; line-height:1.05;
    text-wrap:balance}
  .list-head p{color:var(--muted); font-size:14px; margin:8px 0 0}

  .projects{display:flex; flex-direction:column; gap:10px; padding:14px 14px calc(120px + var(--host-pad))}
  .pcard{
    display:flex; align-items:center; gap:14px; text-align:left; width:100%;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    padding:14px 15px; transition:transform .08s ease, border-color .15s ease;
  }
  .pcard:hover{border-color:var(--accent)}
  .pcard:active{transform:scale(.99)}
  .pcard .thumb{
    width:46px; height:46px; border-radius:12px; flex:none; display:grid; place-items:center;
    background:linear-gradient(150deg,var(--surface-2),var(--ground));
    border:1px solid var(--line); color:var(--accent);
  }
  .pcard .meta{flex:1; min-width:0}
  .pcard .meta .name{font-family:var(--f-display); font-weight:700; font-size:17px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pcard .meta .sub{font-family:var(--f-mono); font-size:11px; color:var(--muted); margin-top:3px;
    letter-spacing:.04em; display:flex; gap:10px}
  .pcard .chev{color:var(--faint); flex:none}

  .empty{padding:60px 32px; text-align:center; color:var(--muted)}
  .empty .big{width:64px; height:64px; margin:0 auto 18px; border-radius:20px; display:grid;
    place-items:center; background:var(--surface); border:1px solid var(--line); color:var(--accent)}
  .empty h3{font-family:var(--f-display); font-weight:700; color:var(--text); margin:0 0 6px; font-size:19px}
  .empty p{margin:0; font-size:14px; line-height:1.5}

  /* floating new button */
  .fab{
    position:absolute; left:0; right:0; bottom:0; padding:16px 18px calc(22px + var(--host-pad));
    background:linear-gradient(to top, var(--ground) 55%, transparent);
    display:flex; z-index:6;
  }
  .fab button{
    flex:1; height:54px; border-radius:16px; background:var(--accent); color:var(--accent-ink);
    font-family:var(--f-display); font-weight:800; font-size:16px; letter-spacing:.02em;
    display:flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:0 8px 22px -6px var(--accent);
  }
  .fab button:active{transform:translateY(1px)}

  /* ---------- project detail ---------- */
  .proj-head{padding:16px 18px 4px}
  .proj-title-row{display:flex; align-items:flex-start; gap:8px}
  .proj-title{font-family:var(--f-display); font-weight:800; font-size:24px; margin:0; line-height:1.08;
    background:none; padding:2px 0; flex:1; text-wrap:balance}
  .proj-title:hover{color:var(--accent)}
  .proj-sub{font-family:var(--f-mono); font-size:11px; color:var(--muted); letter-spacing:.06em;
    margin-top:6px; display:flex; gap:12px}

  /* bpm / metronome bar */
  .rack{
    margin:14px 14px 0; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-md); padding:12px 14px; display:flex; align-items:center; gap:12px;
  }
  .metro-toggle{
    width:52px; height:52px; border-radius:14px; flex:none; display:grid; place-items:center;
    border:1px solid var(--line); background:var(--surface-2); color:var(--muted); position:relative;
  }
  .metro-toggle.on{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
  .metro-toggle .lbl{position:absolute; bottom:4px; font-family:var(--f-mono); font-size:8px;
    letter-spacing:.1em}
  .bpm-block{flex:1; min-width:0}
  .bpm-row{display:flex; align-items:baseline; gap:8px}
  .bpm-num{font-family:var(--f-mono); font-weight:700; font-size:30px; line-height:1; font-variant-numeric:tabular-nums}
  .bpm-unit{font-family:var(--f-mono); font-size:11px; color:var(--muted); letter-spacing:.14em}
  .bpm-ctrls{display:flex; gap:6px; margin-top:8px}
  .bpm-ctrls button{
    height:30px; min-width:34px; padding:0 8px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font-family:var(--f-mono); font-weight:700; font-size:13px;
  }
  .bpm-ctrls button:hover{border-color:var(--accent)}
  .bpm-ctrls .tap{color:var(--muted); font-size:11px; letter-spacing:.08em; min-width:52px}
  .beatdots{display:flex; gap:5px; margin-top:9px}
  .beatdots i{width:7px; height:7px; border-radius:50%; background:var(--line); transition:background .05s, transform .05s}
  .beatdots i.hit{background:var(--accent); transform:scale(1.35)}
  .beatdots i.hit.one{background:var(--rec)}

  /* control chips (mic + modo) */
  .ctrl-row{display:flex; gap:9px; padding:12px 14px 0}
  .chip{flex:1; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-md); padding:10px 11px; text-align:left; min-width:0}
  .chip:hover{border-color:var(--accent)}
  .chip .ci{width:32px; height:32px; border-radius:9px; flex:none; display:grid; place-items:center;
    background:var(--surface-2); color:var(--accent)}
  .chip .cx{min-width:0; flex:1}
  .chip .ck{display:block; font-family:var(--f-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chip .cv{display:block; font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px}
  .chip .cc{color:var(--faint); flex:none}

  /* opciones tipo radio en las hojas */
  .opt{display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; padding:13px 14px;
    border-radius:14px; border:1px solid var(--line); background:var(--ground); margin-bottom:9px}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{border-color:var(--accent); background:var(--accent-soft)}
  .opt .rad{width:20px; height:20px; border-radius:50%; border:2px solid var(--faint); flex:none; margin-top:1px;
    display:grid; place-items:center}
  .opt.sel .rad{border-color:var(--accent)}
  .opt.sel .rad::after{content:""; width:10px; height:10px; border-radius:50%; background:var(--accent)}
  .opt .ot{font-weight:600; font-size:15px; display:block}
  .opt .od{font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.45; display:block}
  .sheet .note{font-size:12px; color:var(--faint); line-height:1.5; margin:2px 0 16px}

  /* recortador de audio */
  .trimbar{position:relative; height:56px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line);
    margin:6px 0 8px; touch-action:none; overflow:hidden; user-select:none}
  .trimbar canvas{position:absolute; inset:0; width:100%; height:100%; z-index:0}
  .trim-sel{position:absolute; top:0; bottom:0; z-index:1; background:rgba(232,163,61,.16); border-left:2px solid var(--accent); border-right:2px solid var(--accent)}
  .trim-h{position:absolute; top:0; bottom:0; width:26px; margin-left:-13px; display:flex; align-items:center; justify-content:center;
    cursor:ew-resize; touch-action:none; z-index:2}
  .trim-h::before{content:""; width:5px; height:64%; border-radius:3px; background:var(--accent); box-shadow:0 0 0 3px var(--ground)}
  .trim-times{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:11px; color:var(--muted); margin:0 2px 16px}
  .trim-times b{color:var(--text); font-weight:700}

  /* punto rojo de guía visual (late al BPM) */
  .beat-pulse{width:64px; height:64px; border-radius:50%; display:none; place-items:center; position:relative}
  .beat-pulse.show{display:grid}
  .beat-pulse .bp{width:22px; height:22px; border-radius:50%; background:var(--rec); opacity:.3;
    transition:transform .07s ease, opacity .07s ease}
  .beat-pulse.hit .bp{transform:scale(1.9); opacity:.95}
  .beat-pulse.hit.one .bp{transform:scale(2.4); opacity:1; box-shadow:0 0 26px var(--rec)}

  /* layers */
  .layers-head{display:flex; align-items:center; justify-content:space-between; padding:22px 18px 8px}
  .layers-head .t{font-family:var(--f-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--faint)}
  .playall{display:flex; align-items:center; gap:7px; font-weight:600; font-size:13px; color:var(--accent);
    padding:6px 10px; border-radius:10px; border:1px solid var(--line)}
  .playall:hover{background:var(--accent-soft)}
  .playall[disabled]{opacity:.4; pointer-events:none}

  .layers{display:flex; flex-direction:column; gap:9px; padding:0 14px calc(190px + var(--host-pad))}
  .layer{
    display:flex; flex-direction:column; gap:9px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-md); padding:11px 12px;
  }
  .layer .lrow{display:flex; align-items:center; gap:12px}
  .layer.muted{opacity:.5}
  .lvol{display:flex; align-items:center; gap:9px; padding:0 2px}
  .lvol .vico{color:var(--faint); flex:none; display:grid; place-items:center}
  .lvol .volval{font-family:var(--f-mono); font-size:10px; color:var(--faint); width:30px; text-align:right; flex:none}
  .volrange{-webkit-appearance:none; appearance:none; flex:1; height:4px; border-radius:3px; background:var(--surface-2); outline:none}
  .volrange::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; border:2px solid var(--surface)}
  .volrange::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--accent); border:none; cursor:pointer}
  .sec-actions{display:flex; gap:8px; padding:2px 14px 2px}
  .sec-actions button{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; height:38px;
    border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-weight:600; font-size:13px}
  .sec-actions button:hover{border-color:var(--accent)}
  .sec-actions button[disabled]{opacity:.4; pointer-events:none}
  .lh-actions{display:flex; align-items:center; gap:8px}
  .loopbtn{display:flex; align-items:center; justify-content:center; width:36px; height:32px; border-radius:10px;
    border:1px solid var(--line); color:var(--muted)}
  .loopbtn.on{color:var(--accent-ink); background:var(--accent); border-color:var(--accent)}
  .layer .lplay{
    width:42px; height:42px; border-radius:12px; flex:none; display:grid; place-items:center;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
  }
  .layer .lplay.playing{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .layer .lmeta{flex:1; min-width:0}
  .layer .lname{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .layer .ltime{font-family:var(--f-mono); font-size:11px; color:var(--muted); margin-top:2px;
    font-variant-numeric:tabular-nums}
  .layer .lctrls{display:flex; gap:2px; flex:none}
  .layer .lctrls button{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; color:var(--muted)}
  .layer .lctrls button:hover{background:var(--surface-2); color:var(--text)}
  .layer .lctrls button.active{color:var(--accent)}
  .layer .lctrls button.del:hover{color:var(--rec)}

  .layers-empty{padding:34px 26px; text-align:center; color:var(--muted); font-size:14px; line-height:1.5}
  .layers-empty b{color:var(--text); font-weight:600}

  /* ---------- transport (record dock) ---------- */
  .dock{
    position:absolute; left:0; right:0; bottom:0; z-index:8;
    padding:14px 18px calc(18px + env(safe-area-inset-bottom) + var(--host-pad));
    background:linear-gradient(to top, var(--ground) 60%, transparent);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .rec-status{height:20px; display:flex; align-items:center; gap:10px; font-family:var(--f-mono);
    font-size:12px; letter-spacing:.06em; color:var(--muted)}
  .rec-status .time{color:var(--text); font-weight:700; font-variant-numeric:tabular-nums}
  .rec-status .live{color:var(--rec); font-weight:700; display:none; align-items:center; gap:6px}
  .rec-status .live::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--rec);
    animation:blink 1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:.15}}
  .level{width:130px; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; display:none}
  .level i{display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--good),var(--accent),var(--rec));
    transform:scaleX(0); transform-origin:left; transition:transform .05s linear}

  .recbtn{
    width:82px; height:82px; border-radius:50%; flex:none; position:relative;
    background:var(--surface); border:2px solid var(--line);
    display:grid; place-items:center; transition:transform .1s ease;
    box-shadow:0 8px 26px -6px rgba(0,0,0,.5);
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .recbtn:active{transform:scale(.96)}
  .recbtn .core{width:34px; height:34px; border-radius:50%; background:var(--rec); transition:all .18s ease}
  .recbtn.armed{border-color:var(--accent)}
  .recbtn.recording{border-color:var(--rec)}
  .recbtn.recording .core{width:26px; height:26px; border-radius:7px}
  .recbtn.recording::after{content:""; position:absolute; inset:-2px; border-radius:50%;
    border:2px solid var(--rec); animation:ring 1.4s ease-out infinite}
  @keyframes ring{0%{transform:scale(1); opacity:.7}100%{transform:scale(1.28); opacity:0}}
  .dock .hint{font-size:11px; color:var(--faint); text-align:center; min-height:14px}

  /* ---------- bottom sheet / dialogs ---------- */
  .sheet-wrap{position:absolute; inset:0; z-index:20; display:none}
  .sheet-wrap.open{display:block}
  .sheet-bg{position:absolute; inset:0; background:rgba(0,0,0,.55); animation:fade .2s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; background:var(--surface);
    border-top:1px solid var(--line); border-radius:22px 22px 0 0; padding:20px 20px calc(22px + env(safe-area-inset-bottom));
    animation:slideup .24s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideup{from{transform:translateY(100%)}}
  .sheet h3{font-family:var(--f-display); font-weight:700; margin:0 0 4px; font-size:19px}
  .sheet p{margin:0 0 16px; color:var(--muted); font-size:14px}
  .sheet input{
    width:100%; background:var(--ground); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; color:var(--text); font-family:var(--f-body); font-size:16px; margin-bottom:16px;
  }
  .sheet input:focus{outline:none; border-color:var(--accent)}
  .sheet-actions{display:flex; gap:10px}
  .sheet-actions button{flex:1; height:50px; border-radius:14px; font-weight:700; font-size:15px; font-family:var(--f-body)}
  .btn-ghost{background:var(--surface-2); color:var(--text); border:1px solid var(--line)}
  .btn-primary{background:var(--accent); color:var(--accent-ink)}
  .btn-danger{background:var(--rec); color:#fff}

  /* mic-error / info banner */
  .banner{margin:12px 14px 0; background:var(--rec-soft); border:1px solid var(--rec);
    border-radius:var(--r-md); padding:12px 14px; font-size:13px; line-height:1.5; color:var(--text); display:none}
  .banner b{color:var(--rec)}

  .toast{position:absolute; left:50%; bottom:120px; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:var(--ground); padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:30; white-space:nowrap}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms!important; transition-duration:.001ms!important}
  }
</style>
</head>
<body>


<div id="app">
  <div class="topbar">
    <button class="iconbtn back" id="backBtn" hidden aria-label="Volver">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Ideas
    </button>
    <div class="brand" id="brandBlock">
      <span class="dot"></span>
      <h1>POCKET CHANNEL</h1>
    </div>
    <div class="spacer"></div>

          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 21V8M12 8l6 13M12 8L7 21"/><path d="M9.5 3h5l3 18"/></svg>

        <span id="recIdle">Listo para grabar</span>

<script>
"use strict";
/* ============================================================
   POCKET CHANNEL — prototipo v1
   Sin dependencias externas. Datos guardados en el propio móvil
   (IndexedDB). Audio con Web Audio API + MediaRecorder.
   ============================================================ */

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmt = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); };
const wait = ms => new Promise(r=>setTimeout(r,ms));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1900); }

/* ---------- almacenamiento (IndexedDB con reserva en memoria) ---------- */
const DB = (()=>{
  let db=null, mem={list:[]}, useMem=false;
  function open(){
    return new Promise((res)=>{
      try{
        const rq=indexedDB.open('pocketchannel',1);
        rq.onupgradeneeded=e=>{ const d=e.target.result; if(!d.objectStoreNames.contains('projects')) d.createObjectStore('projects',{keyPath:'id'}); };
        rq.onsuccess=e=>{ db=e.target.result; res(); };
        rq.onerror=()=>{ useMem=true; res(); };
      }catch(e){ useMem=true; res(); }
    });
  }
  function all(){
    if(useMem) return Promise.resolve([...mem.list]);
    return new Promise((res)=>{ const tx=db.transaction('projects','readonly').objectStore('projects').getAll(); tx.onsuccess=()=>res(tx.result||[]); tx.onerror=()=>res([]); });
  }
  function put(p){
    if(useMem){ const i=mem.list.findIndex(x=>x.id===p.id); if(i<0)mem.list.push(p); else mem.list[i]=p; return Promise.resolve(); }
    return new Promise((res)=>{ const tx=db.transaction('projects','readwrite').objectStore('projects').put(p); tx.onsuccess=()=>res(); tx.onerror=()=>res(); });
  }
  function del(id){
    if(useMem){ mem.list=mem.list.filter(x=>x.id!==id); return Promise.resolve(); }
    return new Promise((res)=>{ const tx=db.transaction('projects','readwrite').objectStore('projects').delete(id); tx.onsuccess=()=>res(); tx.onerror=()=>res(); });
  }
  return {open,all,put,del,isMem:()=>useMem};
})();

/* ---------- estado ---------- */
let projects=[];
let current=null;          // proyecto abierto
let metroOn=false;
let audioCtx=null;
let monitorMode='visual';   // 'visual' (sin cascos, guía visual) | 'audible' (con cascos, escuchar)
let selectedMic='auto';     // 'auto' o deviceId concreto
let micList=[];
let holdActive=false, discardRec=false;   // grabar manteniendo pulsado (estilo WhatsApp)
let loopAll=false;                         // reproducir/grabar sobre bucle

/* ---------- audio context ---------- */
function ctx(){ if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); } if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }

/* ---------- metrónomo ---------- */
const metro={bpm:90, next:0, beat:0, timer:null, running:false, silent:false};
function scheduleClick(time, beat){
  const c=audioCtx; const accent=(beat%4===0);
  if(!metro.silent){                     // en modo guía visual no suena: solo parpadea
    const osc=c.createOscillator(), g=c.createGain();
    osc.frequency.value=accent?1600:1050;
    g.gain.setValueAtTime(0.0001,time);
    g.gain.exponentialRampToValueAtTime(accent?0.6:0.32,time+0.001);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.05);
    osc.connect(g).connect(c.destination);
    osc.start(time); osc.stop(time+0.06);
  }
  const when=(time-c.currentTime)*1000;
  setTimeout(()=>flashBeat(beat), Math.max(0,when));   // pasamos el tiempo exacto, no el metro.beat ya avanzado
}
function flashBeat(beat){
  const idx=((beat%4)+4)%4; const accent=(beat%4===0);
  const dots=$('#beatDots').children;
  for(let i=0;i<dots.length;i++) dots[i].classList.remove('hit','one');
  dots[idx].classList.add('hit'); if(accent) dots[idx].classList.add('one');
  setTimeout(()=>{ if(dots[idx]) dots[idx].classList.remove('hit','one'); },120);
  const bp=$('#beatPulse');                // punto rojo grande de guía visual
  if(bp.classList.contains('show')){
    bp.classList.add('hit'); if(accent) bp.classList.add('one');
    setTimeout(()=>bp.classList.remove('hit','one'),110);
  }
}
function metroLoop(){
  const c=audioCtx;
  while(metro.next < c.currentTime + 0.12){
    scheduleClick(metro.next, metro.beat);
    metro.next += 60/metro.bpm; metro.beat++;
  }
  metro.timer=setTimeout(metroLoop,25);
}
function startMetro(){ ctx(); metro.beat=0; metro.next=audioCtx.currentTime+0.06; metro.running=true; metroLoop(); }
function stopMetro(){ metro.running=false; clearTimeout(metro.timer); metro.timer=null;
  const dots=$('#beatDots').children; for(const d of dots) d.classList.remove('hit','one'); }

/* ---------- reproducción de capas ---------- */
let activeNodes=[];        // fuentes Web Audio en curso
let playToken=0;
function layerTrim(l){ const full=l.dur||0; const ts=Math.max(0,l.trimStart||0); let te=(l.trimEnd!=null?l.trimEnd:full);
  if(!(te>ts)) te=full; const trimmed=(ts>0)||(l.trimEnd!=null); return {ts,te,full,trimmed,region:(te>ts?te-ts:full)}; }
function trimFor(l, fullDur){ const full=fullDur||l.dur||0; const ts=Math.max(0,Math.min(l.trimStart||0, full));
  let te=(l.trimEnd!=null?l.trimEnd:full); te=Math.min(Math.max(te,ts),full);
  const trimmed=((l.trimStart||0)>0)||(l.trimEnd!=null); return {ts:(te>ts?ts:0), region:(te>ts?te-ts:full), trimmed}; }
async function ensureBuf(l){ if(l._buf) return l._buf; const ac=ctx(); const arr=await l.blob.arrayBuffer(); l._buf=await ac.decodeAudioData(arr); return l._buf; }
async function playLayers(layers, onEndAll){
  stopLayers();
  const ac=ctx(); const total=layers.length;
  if(total===0){ if(onEndAll) onEndAll(); return; }
  const myToken=playToken;
  let bufs;
  try{ bufs=await Promise.all(layers.map(l=>ensureBuf(l).then(b=>({l,b})).catch(()=>({l,b:null})))); }
  catch(e){ if(onEndAll) onEndAll(); return; }
  if(myToken!==playToken) return;                       // cancelado mientras descodificaba
  let ended=0; const startT=ac.currentTime+0.04;
  bufs.forEach(({l,b})=>{
    if(!b){ ended++; if(ended>=total && onEndAll && myToken===playToken) onEndAll(); return; }
    const T=trimFor(l, b.duration); const region=Math.max(0.02, T.region);
    const src=ac.createBufferSource(); src.buffer=b;
    const g=ac.createGain(); const target=(l.volume==null?1:l.volume);
    const fin=Math.min(0.012, region/2), fout=Math.min(0.02, region/2);
    g.gain.setValueAtTime(0.0001, startT);
    g.gain.linearRampToValueAtTime(target, startT+fin);
    g.gain.setValueAtTime(target, startT+Math.max(fin, region-fout));
    g.gain.linearRampToValueAtTime(0.0001, startT+region);
    src.connect(g).connect(ac.destination);
    try{ src.start(startT, T.ts, region); }catch(e){ try{ src.start(startT); }catch(_){} }
    src._g=g; src._lid=l.id;
    src.onended=()=>{ ended++; if(onEndAll && ended>=total && myToken===playToken) onEndAll(); };
    activeNodes.push(src);
  });
}
function stopLayers(){
  playToken++;
  const ac=audioCtx;
  activeNodes.forEach(src=>{ try{
    if(ac && src._g){ const now=ac.currentTime, g=src._g;
      try{ g.gain.cancelScheduledValues(now); }catch(e){}
      let v=1; try{ v=g.gain.value; }catch(e){}
      try{ g.gain.setValueAtTime(v, now); g.gain.linearRampToValueAtTime(0.0001, now+0.025); }catch(e){}  // fundido de salida corto
      try{ src.stop(now+0.05); }catch(e){}
    } else { try{ src.stop(); }catch(e){} }
  }catch(e){} });
  activeNodes=[];
}

/* ---------- grabación ---------- */
let stream=null, recorder=null, chunks=[], recStart=0, recTimer=null, analyser=null, levelRAF=null, recState='idle';
async function getStream(force){
  if(stream && !force) return stream;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  const audio={echoCancellation:false, noiseSuppression:false, autoGainControl:false};
  if(selectedMic && selectedMic!=='auto') audio.deviceId={exact:selectedMic};
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio});
  }catch(e){
    if(selectedMic!=='auto'){ // el micro elegido ya no está: volvemos a automático
      selectedMic='auto'; savePrefs(); updateChips();
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    } else throw e;
  }
  return stream;
}
async function loadMics(){
  try{ const devs=await navigator.mediaDevices.enumerateDevices(); micList=devs.filter(d=>d.kind==='audioinput' && d.deviceId); }
  catch(e){ micList=[]; }
}
function micLabelById(id){ const d=micList.find(x=>x.deviceId===id); return d?(d.label||'Micrófono elegido'):null; }
function showMicError(e){
  const b=$('#micBanner');
  b.style.display='block';
  b.innerHTML='<b>No puedo acceder al micrófono.</b> Para grabar, tu navegador necesita permiso de micrófono y una conexión segura (https). Si estás viendo esto dentro de una vista previa, ábrela en una pestaña propia o desde tu web. ('+ (e&&e.name?e.name:'error') +')';
}
function startLevel(){
  try{
    const c=ctx(); const src=c.createMediaStreamSource(stream);
    analyser=c.createAnalyser(); analyser.fftSize=256; src.connect(analyser);
    const data=new Uint8Array(analyser.fftSize);
    $('#level').style.display='block';
    (function loop(){ analyser.getByteTimeDomainData(data); let peak=0;
      for(let i=0;i<data.length;i++){ const v=Math.abs(data[i]-128)/128; if(v>peak)peak=v; }
      $('#levelBar').style.transform='scaleX('+Math.min(1,peak*1.9)+')';
      levelRAF=requestAnimationFrame(loop);
    })();
  }catch(e){}
}
function stopLevel(){ if(levelRAF)cancelAnimationFrame(levelRAF); levelRAF=null; $('#level').style.display='none'; $('#levelBar').style.transform='scaleX(0)'; }

async function startRecording(){
  $('#micBanner').style.display='none';
  try{ await getStream(); }catch(e){ showMicError(e); resetDockUI(); return; }
  if(!holdActive){ resetDockUI(); return; }   // soltó antes de que llegara el permiso/stream
  ctx();
  recState='arming';
  const btn=$('#recBtn'); btn.classList.add('armed');
  $('#recIdle').hidden=true; $('#recHint').textContent='';

  const backing=current.layers.filter(l=>!l.muted);
  const hasBacking=backing.length>0;
  const visual = monitorMode==='visual';
  // ¿corre la referencia de tempo? visual: si hay metrónomo O capas debajo. audible: solo si metrónomo.
  const runScheduler = visual ? (metroOn || hasBacking) : metroOn;
  metro.silent = visual;                     // en visual, la referencia no suena
  if(visual && (metroOn || hasBacking)) $('#beatPulse').classList.add('show');

  // cuenta de entrada de 4 tiempos si hay referencia de tempo
  if(runScheduler){
    $('#recHint').textContent='Cuenta de entrada…';
    startMetro();
    await wait((60/metro.bpm)*4*1000);
    if(recState!=='arming'){ return; }       // cancelado durante la cuenta
  }
  // las capas suenan SOLO en modo con cascos (en bucle si está activado)
  if(!visual && hasBacking){
    (function bck(){ playLayers(backing, ()=>{ if(recState==='recording' && loopAll) bck(); }); })();
  }

  chunks=[];
  try{ recorder=new MediaRecorder(stream); }
  catch(e){ recorder=new MediaRecorder(stream,{mimeType:'audio/webm'}); }
  recorder.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop=onRecStop;
  recorder.start();
  recState='recording'; recStart=Date.now();
  if(navigator.vibrate) navigator.vibrate(45);         // vibración al empezar a grabar
  btn.classList.remove('armed'); btn.classList.add('recording');
  $('#liveTag').style.display='flex';
  const tt=$('#recTime'); tt.hidden=false; tt.textContent='00:00';
  if(visual && hasBacking) $('#recHint').textContent='Guía visual · sin sonido, sigue el punto rojo al ritmo';
  else if(visual && metroOn) $('#recHint').textContent='Sigue el punto rojo (metrónomo silencioso)';
  else if(!visual && hasBacking) $('#recHint').textContent='Grabando sobre '+backing.length+' capa'+(backing.length>1?'s':'')+' · usa cascos';
  else $('#recHint').textContent='Suelta para parar';
  recTimer=setInterval(()=>{ tt.textContent=fmt((Date.now()-recStart)/1000); },200);
  startLevel();
}
function stopRecording(){
  if(recState==='arming'){ // cancelar cuenta de entrada
    recState='idle'; stopMetro(); metro.silent=false; $('#beatPulse').classList.remove('show'); resetDockUI(); return;
  }
  if(recState!=='recording') return;
  recState='saving';
  try{ recorder.stop(); }catch(e){}
  stopMetro(); metro.silent=false;
  $('#beatPulse').classList.remove('show');
  stopLayers(); clearInterval(recTimer); stopLevel();
}
function onRecStop(){
  if(discardRec){ discardRec=false; recState='idle'; resetDockUI(); toast('Mantén pulsado para grabar'); return; }
  const type=(recorder&&recorder.mimeType)||'audio/webm';
  const blob=new Blob(chunks,{type});
  const dur=(Date.now()-recStart)/1000;
  const layer={id:uid(), name:'Capa '+(current.layers.length+1), blob, dur, createdAt:Date.now(), muted:false};
  current.layers.push(layer);
  current.updatedAt=Date.now();
  DB.put(clone(current)).then(()=>{ renderLayers(); renderProjectSub(); });
  recState='idle'; resetDockUI();
  if(navigator.vibrate) navigator.vibrate([30,60,40]);   // vibración de confirmación al guardar
  toast('Capa guardada');
}
function resetDockUI(){
  const btn=$('#recBtn'); btn.classList.remove('armed','recording');
  $('#liveTag').style.display='none'; $('#recTime').hidden=true;
  $('#recIdle').hidden=false; $('#recHint').textContent='Mantén pulsado para grabar';
}

/* blobs no se pueden pasar a IndexedDB dentro de proxies raros; clon simple */
function clone(p){ return {id:p.id, name:p.name, bpm:p.bpm, createdAt:p.createdAt, updatedAt:p.updatedAt,
  layers:p.layers.map(l=>({id:l.id,name:l.name,blob:l.blob,dur:l.dur,createdAt:l.createdAt,muted:l.muted,volume:(l.volume==null?1:l.volume),imported:!!l.imported,trimStart:(l.trimStart||0),trimEnd:(l.trimEnd==null?null:l.trimEnd)}))}; }

/* ---------- navegación ---------- */
function show(which){
  const p=which==='projects';
  $('#screenProjects').hidden=!p; $('#screenProject').hidden=p;
  $('#backBtn').hidden=p; $('#brandBlock').style.display=p?'flex':'none';
  if(p){ stopAllPlayback(); }
}
function stopAllPlayback(){ stopLayers(); layerPlaying=null; if(playAllState){playAllState=false;} updatePlayAllUI(); refreshLayerPlayIcons(); }

/* ---------- render: lista de proyectos ---------- */
function renderProjects(){
  const box=$('#projectsList'); box.innerHTML='';
  if(!projects.length){
    box.innerHTML='<div class="empty"><div class="big"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg></div><h3>Aún no hay ideas</h3><p>Toca «Nueva idea» y graba lo primero que se te ocurra. Podrás seguir apilando capas cuando quieras.</p></div>';
    return;
  }
  const sorted=[...projects].sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt));
  sorted.forEach(p=>{
    const b=document.createElement('button'); b.className='pcard';
    const total=p.layers.reduce((s,l)=>s+(l.dur||0),0);

/* ---------- descargar la demo mezclada (todas las capas activas en un audio) ---------- */
async function downloadMix(){
  const layers=current.layers.filter(l=>!l.muted);
  if(!layers.length){ toast('No hay capas activas para mezclar'); return; }
  toast('Preparando la mezcla…');
  try{
    const ac=ctx(); const sr=ac.sampleRate;
    const parts=[];
    for(const l of layers){
      const buf=await ensureBuf(l);
      const ts=Math.min(Math.max(0,l.trimStart||0), buf.duration);
      let te=(l.trimEnd!=null? l.trimEnd : buf.duration); te=Math.min(Math.max(te,ts), buf.duration);
      const d=Math.max(0, (te>ts? te-ts : buf.duration));
      parts.push({buf, vol:(l.volume==null?1:l.volume), ts:(te>ts?ts:0), dur:d});
    }
    const length=Math.max(1, Math.ceil(Math.max.apply(null, parts.map(p=>p.dur))*sr));
    const off=new OfflineAudioContext(2, length, sr);
    parts.forEach(p=>{ const s=off.createBufferSource(); s.buffer=p.buf; const g=off.createGain();
      const d=p.dur, fin=0.008, fout=Math.min(0.03, d/2);   // pequeños fundidos para evitar clicks
      g.gain.setValueAtTime(0.0001,0); g.gain.linearRampToValueAtTime(p.vol,fin);
      g.gain.setValueAtTime(p.vol,Math.max(fin,d-fout)); g.gain.linearRampToValueAtTime(0.0001,d);
      s.connect(g).connect(off.destination); s.start(0, p.ts, p.dur); });
    const out=await off.startRendering();
    const blob=new Blob([bufferToWav(out)],{type:'audio/wav'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=(current.name+' - mezcla.wav').replace(/[\/\\:*?"<>|]/g,'_');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),6000);
    if(navigator.vibrate) navigator.vibrate(30);
    toast('Mezcla descargada');
  }catch(e){ toast('No se pudo mezclar ('+((e&&e.name)||'error')+')'); }
}
function bufferToWav(buffer){
  const numCh=Math.min(2,buffer.numberOfChannels), len=buffer.length, sr=buffer.sampleRate;
  const blockAlign=numCh*2, dataSize=len*blockAlign;
  const ab=new ArrayBuffer(44+dataSize), view=new DataView(ab); let p=0;
  const ws=s=>{ for(let i=0;i<s.length;i++) view.setUint8(p++, s.charCodeAt(i)); };
  const u32=v=>{ view.setUint32(p,v,true); p+=4; };
  const u16=v=>{ view.setUint16(p,v,true); p+=2; };
  ws('RIFF'); u32(36+dataSize); ws('WAVE'); ws('fmt '); u32(16); u16(1); u16(numCh); u32(sr); u32(sr*blockAlign); u16(blockAlign); u16(16); ws('data'); u32(dataSize);
  const chans=[]; for(let c=0;c<numCh;c++) chans.push(buffer.getChannelData(c));
  for(let i=0;i<len;i++){ for(let c=0;c<numCh;c++){ let s=Math.max(-1,Math.min(1,chans[c][i])); view.setInt16(p, s<0? s*0x8000 : s*0x7FFF, true); p+=2; } }
  return ab;
}

/* ---------- importar un audio externo como capa ---------- */
function audioDuration(blob){ return new Promise((res)=>{ const u=URL.createObjectURL(blob); const a=new Audio(); a.preload='metadata';
  a.onloadedmetadata=()=>{ const d=isFinite(a.duration)?a.duration:0; URL.revokeObjectURL(u); res(d); };
  a.onerror=()=>{ URL.revokeObjectURL(u); res(0); }; a.src=u; }); }
async function onImportFile(e){

/* ---------- recortar audio (no destructivo) ---------- */
function trimSheet(l){
  stopLayers(); layerPlaying=null;
  const full=Math.max(0.05, l.dur||0);
  let ts=Math.max(0, l.trimStart||0);
  let te=(l.trimEnd!=null? l.trimEnd : full);
  if(!(te>ts)){ ts=0; te=full; }
  const fmtt=s=>{ s=Math.max(0,s); return s<60 ? s.toFixed(1)+'s' : Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); };
  openSheet(
    '<h3>Recortar «'+escapeHtml(l.name)+'»</h3>'+
    '<p class="note">Arrastra los bordes para quedarte solo con el trozo que quieras. No se toca el audio original.</p>'+
    '<div class="trimbar" id="tb"><canvas id="twave"></canvas><div class="trim-sel" id="tsel"></div><div class="trim-h" id="thS"></div><div class="trim-h" id="thE"></div></div>'+
    '<div class="trim-times"><span>Inicio <b id="tIni">0</b></span><span>Dura <b id="tDur">0</b></span><span>Fin <b id="tFin">0</b></span></div>'+
    '<div class="sheet-actions"><button class="btn-ghost" id="tPrev">▶ Escuchar recorte</button><button class="btn-primary" id="tSave">Guardar</button></div>'+
    '<div class="sheet-actions" style="margin-top:10px"><button class="btn-ghost" id="tReset">Quitar recorte</button><button class="btn-ghost" id="tCancel">Cancelar</button></div>'
  );
  const bar=$('#tb'), sel=$('#tsel'), hS=$('#thS'), hE=$('#thE');
  function redraw(){ const w=bar.clientWidth||1; const a=ts/full, b=te/full;
    hS.style.left=(a*w)+'px'; hE.style.left=(b*w)+'px';
    sel.style.left=(a*w)+'px'; sel.style.width=Math.max(0,(b-a)*w)+'px';
    $('#tIni').textContent=fmtt(ts); $('#tFin').textContent=fmtt(te); $('#tDur').textContent=fmtt(te-ts);
  }
  async function drawWave(){
    try{ const b=await ensureBuf(l); const cv=$('#twave'); if(!cv) return;
      const w=bar.clientWidth||300, h=bar.clientHeight||56, dpr=Math.min(2, window.devicePixelRatio||1);
      cv.width=w*dpr; cv.height=h*dpr;
      const cx=cv.getContext('2d'); cx.scale(dpr,dpr); cx.clearRect(0,0,w,h);
      const ch=b.getChannelData(0), n=ch.length, mid=h/2, step=Math.max(1, Math.floor(n/w));
      cx.strokeStyle=(getComputedStyle(document.documentElement).getPropertyValue('--muted').trim()||'#9a8f7d');
      cx.globalAlpha=0.85; cx.beginPath();
      for(let x=0;x<w;x++){ let mn=1,mx=-1; const s=x*step; for(let i=0;i<step;i++){ const v=ch[s+i]||0; if(v<mn)mn=v; if(v>mx)mx=v; }
        cx.moveTo(x+0.5, mid+mn*mid*0.92); cx.lineTo(x+0.5, mid+mx*mid*0.92); }
      cx.stroke();
    }catch(e){}
  }
  setTimeout(()=>{ redraw(); drawWave(); },30);
  function drag(handle, isStart){
    handle.addEventListener('pointerdown', e=>{ e.preventDefault(); try{handle.setPointerCapture(e.pointerId);}catch(_){}
      const move=ev=>{ const rect=bar.getBoundingClientRect(); let x=(ev.clientX-rect.left)/rect.width; x=Math.max(0,Math.min(1,x)); const t=x*full;
        if(isStart) ts=Math.min(t, te-0.05); else te=Math.max(t, ts+0.05);
        ts=Math.max(0,ts); te=Math.min(full,te); redraw();
      };
      const up=()=>{ handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); handle.removeEventListener('pointercancel',up); };
      handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up); handle.addEventListener('pointercancel',up);
    });
  }
  drag(hS,true); drag(hE,false);
  let pa=null;
  function closePrev(){ if(pa){ try{pa.pause();}catch(e){} if(pa._u)URL.revokeObjectURL(pa._u); clearTimeout(pa._t); pa=null; } const b=$('#tPrev'); if(b) b.textContent='▶ Escuchar recorte'; }
  $('#tPrev').onclick=()=>{ if(pa){ closePrev(); return; }
    const u=URL.createObjectURL(l.blob); pa=new Audio(u); pa._u=u;
    const go=()=>{ try{pa.currentTime=ts;}catch(e){} pa.play().catch(()=>{}); pa._t=setTimeout(closePrev, Math.max(60,(te-ts)*1000)); };
    if(pa.readyState>=1) go(); else pa.addEventListener('loadedmetadata',go,{once:true});
    $('#tPrev').textContent='⏸ Parar';
  };
  $('#tSave').onclick=()=>{ closePrev(); l.trimStart=ts; l.trimEnd=te; current.updatedAt=Date.now(); DB.put(clone(current)); closeSheet(); renderLayers(); renderProjectSub(); toast('Recorte guardado'); };
  $('#tReset').onclick=()=>{ closePrev(); l.trimStart=0; l.trimEnd=null; current.updatedAt=Date.now(); DB.put(clone(current)); closeSheet(); renderLayers(); renderProjectSub(); toast('Recorte quitado'); };
  $('#tCancel').onclick=()=>{ closePrev(); closeSheet(); };
}

  html+='<div class="sheet-actions"><button class="btn-primary" id="monDone">Hecho</button></div>';
  openSheet(html);
  document.querySelectorAll('#sheet .opt').forEach(o=>o.onclick=()=>{ monitorMode=o.dataset.v; savePrefs(); updateChips(); monitorSheet(); });
  $('#monDone').onclick=closeSheet;
}

function updateChips(){
  const mv=$('#micChipVal'); if(mv) mv.textContent = selectedMic==='auto' ? 'Automático' : (micLabelById(selectedMic)||'Micro elegido');
  const nv=$('#monChipVal'); if(nv) nv.textContent = monitorMode==='visual' ? 'Guía visual' : 'Escuchar (cascos)';
}
function savePrefs(){ try{ localStorage.setItem('pc-monitor',monitorMode); localStorage.setItem('pc-mic',selectedMic); }catch(e){} }
function loadPrefs(){ try{ const m=localStorage.getItem('pc-monitor'); if(m)monitorMode=m; const c=localStorage.getItem('pc-mic'); if(c)selectedMic=c; }catch(e){} }

/* ---------- metrónomo / bpm ---------- */
function setBpm(v){ metro.bpm=Math.max(40,Math.min(240,v)); $('#bpmNum').textContent=metro.bpm;
  if(current){ current.bpm=metro.bpm; DB.put(clone(current)); } }
$('#bpmUp').onclick=()=>setBpm(metro.bpm+1);
$('#bpmDown').onclick=()=>setBpm(metro.bpm-1);
let holdTimer=null;
['#bpmUp','#bpmDown'].forEach(sel=>{ const el=$(sel); const step=sel==='#bpmUp'?1:-1;
  el.addEventListener('pointerdown',()=>{ holdTimer=setTimeout(function rep(){ setBpm(metro.bpm+step); holdTimer=setTimeout(rep,70); },420); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(holdTimer)));
});
let taps=[];
$('#tapBtn').onclick=()=>{ const now=performance.now(); taps=taps.filter(t=>now-t<2200); taps.push(now);
  if(taps.length>=2){ let sum=0; for(let i=1;i<taps.length;i++)sum+=taps[i]-taps[i-1]; const avg=sum/(taps.length-1); setBpm(Math.round(60000/avg)); }
  $('#tapBtn').textContent='TAP'; };
$('#metroToggle').onclick=()=>{ metroOn=!metroOn; const b=$('#metroToggle'); b.classList.toggle('on',metroOn); b.setAttribute('aria-pressed',metroOn?'true':'false');
  ctx(); // desbloquear audio en móvil
  if(metroOn && recState==='idle'){ toast(monitorMode==='visual' ? 'Metrónomo silencioso: guía con el punto rojo' : 'El clic sonará por los cascos al grabar'); } };

/* ---------- botón de grabación ---------- */
/* grabar manteniendo pulsado (estilo nota de voz de WhatsApp) */
(function setupHoldRecord(){
  const btn=$('#recBtn');
  function down(e){ e.preventDefault(); if(recState!=='idle') return; holdActive=true; ctx(); startRecording(); }
  function up(){ if(!holdActive) return; holdActive=false;
    if(recState==='arming') stopRecording();                         // soltó durante la cuenta de entrada
    else if(recState==='recording'){ if(Date.now()-recStart < 400) discardRec=true; stopRecording(); }
  }
  btn.addEventListener('pointerdown', down);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  btn.addEventListener('contextmenu', e=>e.preventDefault());
})();

/* ---------- eventos varios ---------- */
$('#newProjectBtn').onclick=newProject;
$('#backBtn').onclick=()=>show('projects');
$('#projTitle').onclick=renameProject;
$('#projMenuBtn').onclick=projectMenu;
$('#playAllBtn').onclick=togglePlayAll;
$('#micChip').onclick=micSheet;
$('#monChip').onclick=monitorSheet;
$('#loopBtn').onclick=()=>{ loopAll=!loopAll; const b=$('#loopBtn'); b.classList.toggle('on',loopAll); b.setAttribute('aria-pressed',loopAll?'true':'false'); toast(loopAll?'Bucle activado (para grabar encima)':'Bucle desactivado'); };
$('#mixBtn').onclick=downloadMix;
$('#importBtn').onclick=()=>$('#importInput').click();
$('#importInput').onchange=onImportFile;
if(navigator.mediaDevices && navigator.mediaDevices.addEventListener){
  navigator.mediaDevices.addEventListener('devicechange', async ()=>{
    await loadMics(); updateChips();
    // si conectas/desconectas cascos y no estás grabando, refresca el micro para el próximo intento
    if(recState==='idle' && stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  });
}

/* tema */
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t);
  $('#themeIcon').innerHTML = t==='dark'
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'
    : '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  try{localStorage.setItem('pc-theme',t);}catch(e){}
}
(function initTheme(){ let t; try{t=localStorage.getItem('pc-theme');}catch(e){}
  if(!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
  applyTheme(t);
})();
$('#themeBtn').onclick=()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');

/* ---------- arranque ---------- */
/* si el hosting gratuito inyecta un banner abajo, dejamos hueco para que no tape los botones (se autoanula sin banner) */
(function hostBannerGuard(){
  function has(){ try{ return document.querySelector('a[href*="tiiny" i],iframe[src*="tiiny" i],[id*="tiiny" i],[class*="tiiny" i]'); }catch(e){ return null; } }
  function apply(){ document.documentElement.style.setProperty('--host-pad', has()?'74px':'0px'); }
  apply(); [500,1500,3000,6000].forEach(t=>setTimeout(apply,t));
  try{ new MutationObserver(apply).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
})();

(async function init(){
  loadPrefs();
  await DB.open();
  projects=await DB.all();
  renderProjects();
  updateChips();
  loadMics().then(updateChips);   // sin permiso aún: rellena lo que se pueda
  show('projects');
})();

/* registro del service worker (offline) + auto-actualización */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('service-worker.js').then(function(r){ try{r.update();}catch(e){} }).catch(function(){});
  });
  var _pcReloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(_pcReloaded) return; _pcReloaded=true;
    if(typeof recState==='undefined' || recState==='idle'){ window.location.reload(); }
  });
}
</script>
